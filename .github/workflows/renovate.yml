name: Renovate

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: renovatebot/github-action@f3a31a786096ba6b40d0f0ffe11a494ef73bfa7c # v46.3.4
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Not Renovate's default renovate@whitesourcesoftware.com, which is
          # a GitHub user owned by Mend.
          RENOVATE_GIT_AUTHOR: "Renovate Bot <39180766+fizzyfuzzle@users.noreply.github.com>"
        with:
          token: "${{ secrets.RENOVATE_TOKEN }}"
