name: Renovate

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: renovatebot/github-action@v46.2.3
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          token: "${{ secrets.RENOVATE_TOKEN }}"
