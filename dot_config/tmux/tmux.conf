## Terminal
set -g default-terminal "tmux-256color"
# foot sets TERM=xterm-256color; advertise truecolor so vim termguicolors works
set -as terminal-features ",xterm-256color:RGB"
# Match vim ttimeoutlen; the default 500ms makes Esc in vim feel laggy
set -s escape-time 10
# Lets vim autoread / gitgutter react to focus changes
set -g focus-events on
# Window title for sway: session:window - pane title
set -g set-titles on
set -g set-titles-string "#S:#W"

## General
# C-Space as prefix: C-a is beginning-of-line in zsh emacs mode.
# Nested tmux on servers keeps the default C-b, so no clash.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
# Closing the last window of a session switches to another session instead of detaching
set -g detach-on-destroy off
setw -g mode-keys vi

## Keys
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Splits and new windows open in the current pane's directory
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane navigation (replaces default l = last-window; prefix + ; still does last-pane)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vim-style copy mode; y copies to the clipboard via OSC 52
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

## Theme
set -g status-style "bg=default,fg=default"
set -g status-left-length 30
set -g status-left "#[bold] #S "
set -g status-right "#{?client_prefix,#[fg=black bg=yellow bold] PREFIX #[default] ,}#{?#{==:#S,#h},,#h  }%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=green,fg=black,bold"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=brightblack"
setw -g pane-border-indicators arrows
set -g message-style "bg=brightblack,fg=brightwhite"
setw -g mode-style "bg=brightblack,fg=brightwhite"

