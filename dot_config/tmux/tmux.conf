## Terminal
set -g default-terminal "tmux-256color"
# Outer-terminal capabilities: TERM=foot (foot default) and TERM=xterm* (fallback).
# sync = synchronized output, reduces flicker when tmux redraws busy agent TUIs.
set -as terminal-features "foot*:RGB:extkeys:clipboard:focus:title:sync"
set -as terminal-features "xterm*:RGB:extkeys"
# Match vim ttimeoutlen; old default 500ms makes Esc laggy
set -s escape-time 10
# vim autoread/gitgutter; agents that react to focus
set -s focus-events on
# Lets apps distinguish Shift+Enter from Enter
set -s extended-keys always
set -s extended-keys-format csi-u
# Pane programs may set the clipboard via OSC 52
set -s set-clipboard on
# Off: would let pane programs send raw escapes to foot
set -g allow-passthrough off
# Window title for sway: session:window
set -g set-titles on
set -g set-titles-string "#S:#W"

## Sessions, windows, panes
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
set -g detach-on-destroy off
setw -g mode-keys vi
set -g status-interval 10
set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}:#{b:pane_current_path}'

## Agent alerts
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell off
set -g silence-action other

## Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

## Keys
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Splits and new windows open in the current pane's directory
unbind '"'
unbind %
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

## Theme
set -g status-style "bg=default,fg=default"
set -g status-left-length 30
set -g status-left "#[bold] #S "
set -g status-right "#{?client_prefix,#[fg=black bg=yellow bold] PREFIX #[default] ,}#h  %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=green,fg=black,bold"
setw -g window-status-bell-style "bg=red,fg=black,bold"
setw -g window-status-activity-style "bg=yellow,fg=black"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=brightblack"
setw -g pane-border-indicators arrows
set -g message-style "bg=brightblack,fg=brightwhite"
setw -g mode-style "bg=brightblack,fg=brightwhite"

