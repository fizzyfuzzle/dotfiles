## Terminal
set -g default-terminal "tmux-256color"
# Outer-terminal capabilities: TERM=foot (foot default) and TERM=xterm* (fallback).
# sync = synchronized output, reduces flicker when tmux redraws busy agent TUIs.
set -as terminal-features "foot*:RGB:extkeys:clipboard:focus:title:sync"
set -as terminal-features "xterm*:RGB:extkeys"
# Match vim ttimeoutlen; old default 500ms makes Esc laggy
set -s escape-time 10
# vim autoread/gitgutter; agents that react to focus
set -s focus-events on
# Lets apps distinguish Shift+Enter from Enter (Claude Code newline)
set -s extended-keys always
set -s extended-keys-format csi-u
# Only tmux copy-mode writes the system clipboard (OSC 52); pane programs can't
set -s set-clipboard external
# Off: would let pane programs send raw escapes to foot, bypassing the line above
set -g allow-passthrough off
# Window title for sway: session:window
set -g set-titles on
set -g set-titles-string "#S:#W"

## Sessions, windows, panes
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
# Closing the last window switches session instead of detaching
set -g detach-on-destroy off
setw -g mode-keys vi

## Agent alerts
# Bell = agent finished / waiting for permission. Passed to foot -> sway urgency.
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell off
# Fallback for agents that don't ring: flag window after N s without output
set -g silence-action other

## Prefix
# C-Space: C-a is beginning-of-line in zsh emacs mode.
# Nested tmux on servers keeps C-b, so no clash.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

## Keys
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Splits and new windows open in the current pane's directory
unbind '"'
unbind %
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane navigation (replaces l = last-window; prefix ; still = last-pane)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Jump to next window with an alert (bell/silence); same as default M-n
bind a next-window -a
# Toggle silence monitoring for the current window (agents without bell support)
bind S if -F "#{monitor-silence}" \
    "setw monitor-silence 0 ; display 'silence monitor: off'" \
    "setw monitor-silence 20 ; display 'silence monitor: 20s'"
# Scratch shell popup in current dir: review diffs/run tests beside an agent
bind g display-popup -E -w 85% -h 85% -d "#{pane_current_path}"

## Copy mode (vi): grab agent output
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

## Theme
set -g status-style "bg=default,fg=default"
set -g status-left-length 30
set -g status-left "#[bold] #S "
set -g status-right "#{?client_prefix,#[fg=black bg=yellow bold] PREFIX #[default] ,}#{?#{==:#S,#h},,#h  }%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=green,fg=black,bold"
setw -g window-status-bell-style "bg=red,fg=black,bold"
setw -g window-status-activity-style "bg=yellow,fg=black"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=brightblack"
setw -g pane-border-indicators arrows
set -g message-style "bg=brightblack,fg=brightwhite"
setw -g mode-style "bg=brightblack,fg=brightwhite"

