## Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features "xterm*:RGB:extkeys"
# Match vim ttimeoutlen; old default 500ms makes Esc laggy
set -s escape-time 10
# vim autoread/gitgutter; agents that react to focus
set -s focus-events on
# Lets apps distinguish Shift+Enter from Enter
set -s extended-keys always
# Pane programs may set the clipboard via OSC 52
set -s set-clipboard on
# Off: would let pane programs send raw escapes to foot
set -g allow-passthrough off

## Sessions, windows, panes
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
setw -g mode-keys vi
set -g status-interval 10

## Agent alerts
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell off
set -g silence-action other

## Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

## Keys
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Splits and new windows open in the current pane's directory
unbind '"'
unbind %
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

## Theme
set -g status-style "bg=default,fg=default,dim"
set -g status-left "#[bold] #S "
set -g status-left-length 30
set -g status-right "#{?window_zoomed_flag,#[fg=black bg=cyan bold] ZOOM #[default] ,}#{?client_prefix,#[fg=black bg=yellow bold] PREFIX #[default] ,}#[fg=cyan bold] #h #[default] %H:%M "
set -g status-right-length 60
setw -g window-status-format " #I:#W "
setw -g window-status-style "fg=default"
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "fg=green,bold"
setw -g window-status-bell-style "bg=red,fg=black,bold"
setw -g window-status-activity-style "bg=yellow,fg=black"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=brightblack"
set -g message-style "bg=brightblack,fg=brightwhite"
setw -g mode-style "bg=brightblack,fg=brightwhite"

